<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>නදී AI - Nadee AI Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 92vh;
            background-color: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .chat-header {
            background-color: #0f172a;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #334155;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .header-info h2 {
            font-size: 1.1rem;
            color: #f8fafc;
        }

        .header-info p {
            font-size: 0.8rem;
            color: #10b981;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-line;
        }

        .user-message {
            align-self: flex-end;
            background-color: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #334155;
            color: #f1f5f9;
            border-bottom-left-radius: 2px;
            border: 1px solid #475569;
        }

        .chat-input-area {
            padding: 15px;
            background-color: #0f172a;
            display: flex;
            gap: 8px;
            border-top: 1px solid #334155;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 25px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
        }

        .action-btn {
            background-color: #334155;
            color: #38bdf8;
            border: 1px solid #475569;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }

        .action-btn:hover {
            background-color: #475569;
        }

        .action-btn.listening {
            background-color: #ef4444;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        button.send-btn {
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background-color: #2563eb;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.send-btn:hover {
            background-color: #1d4ed8;
        }

        .typing {
            font-style: italic;
            color: #94a3b8;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="avatar">AI</div>
        <div class="header-info">
            <h2>නදී AI (Nadee AI)</h2>
            <p>● Online | Math Assistant</p>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message ai-message">
            ආයුබෝවන්! මම <strong>නදී AI</strong>. 
            <br><br>
        </div>
    </div>

    <div class="chat-input-area">
        <!-- කැමරාවෙන් හෝ ගැලරියෙන් පින්තූරයක් ලබා ගැනීමට -->
        <input type="file" id="imageInput" accept="image/*" capture="environment" style="display: none;" onchange="handleImageUpload(event)">
        <button class="action-btn" onclick="document.getElementById('imageInput').click()" title="කැමරාවෙන් පින්තූරයක් ගන්න">📷</button>
        
        <!-- කටහඬින් විධාන ලබා දීමට -->
        <button class="action-btn" id="micBtn" onclick="toggleSpeechRecognition()" title="කටහඬින් කතා කරන්න">🎤</button>
        
        <input type="text" id="userInput" placeholder="ගානක් හෝ ප්‍රශ්නයක් ටයිප් කරන්න..." onkeydown="checkEnter(event)">
        <button class="send-btn" onclick="sendMessage()">යවන්න</button>
    </div>
</div>

<script>
    // ============================================================
    // AQ.Ab8RN6JnqMvFGhQ_1fmGUrFEmEIxQ-ZJR4hEPgJ0CxZRhZjzJA
    // ============================================================
    const GEMINI_API_KEY = "AQ.Ab8RN6JnqMvFGhQ_1fmGUrFEmEIxQ-ZJR4hEPgJ0CxZRhZjzJA";

    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const micBtn = document.getElementById('micBtn');

    // Speech Recognition Setup
    let recognition;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'si-LK';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = function() {
            isListening = true;
            micBtn.classList.add('listening');
            userInput.placeholder = "කතා කරන්න... (Listening...)";
        };

        recognition.onresult = function(event) {
            const speechResult = event.results[0][0].transcript;
            userInput.value = speechResult;
            sendMessage();
        };

        recognition.onerror = function(event) {
            console.error("Speech recognition error:", event.error);
            alert("කටහඬ හඳුනාගැනීමේ දෝෂයක්: " + event.error);
            stopListening();
        };

        recognition.onend = function() {
            stopListening();
        };
    }

    function toggleSpeechRecognition() {
        if (!recognition) {
            alert("ඔබේ බ්‍රවුසරය කටහඬ හඳුනාගැනීම සඳහා සහය නොදක්වයි.");
            return;
        }

        if (isListening) {
            recognition.stop();
        } else {
            try {
                recognition.start();
            } catch (err) {
                console.error(err);
                alert("මයික්‍රෆෝනය ආරම්භ කිරීමේදී දෝෂයක් ඇති විය.");
            }
        }
    }

    function stopListening() {
        isListening = false;
        micBtn.classList.remove('listening');
        userInput.placeholder = "ගැටලුව ටයිප් කරන්න...";
    }

    function sendMessage() {
        const text = userInput.value.trim();
        if (text === "") return;

        appendMessage(text, 'user-message');
        userInput.value = "";
        showTypingAndRespond(text, null);
    }

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                const imgHtml = `<img src="${dataUrl}" style="max-width: 100%; border-radius: 8px; margin-bottom: 5px;"><br>📸 [පින්තූරය විශ්ලේෂණය කරමින්...]`;
                appendMessage(imgHtml, 'user-message');

                const mimeType = file.type || "image/jpeg";
                const base64Data = dataUrl.split(',')[1];
                showTypingAndRespond(
                    "මෙම පින්තූරයේ ඇති ගණිත ගැටලුව හඳුනාගෙන පියවරෙන් පියවර සිංහලෙන් විසඳන්න.",
                    { mimeType: mimeType, data: base64Data }
                );
            };
            reader.readAsDataURL(file);
        }
    }

    async function showTypingAndRespond(input, imageData) {
        const typingElem = document.createElement('div');
        typingElem.className = 'message ai-message typing';
        typingElem.innerText = 'නදී AI පිළිතුර සකසමින්...';
        chatMessages.appendChild(typingElem);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (!imageData) {
            const localResponse = solveMathSyllabus(input);
            if (localResponse !== null) {
                setTimeout(() => {
                    chatMessages.removeChild(typingElem);
                    appendMessage(localResponse, 'ai-message');
                }, 400);
                return;
            }
        }

        typingElem.innerText = '✨ NADEE AI_typing...';
        const geminiResponse = await askGeminiAI(input, imageData);
        chatMessages.removeChild(typingElem);
        appendMessage(geminiResponse, 'ai-message');
    }

    function solveMathSyllabus(input) {
        const normalized = input.replace(/×/g, '*').replace(/÷/g, '/').trim();
        const lower = normalized.toLowerCase();

        if (lower.includes("පයිතගරස්") || lower.includes("pythagoras")) {
            return `📐 <strong>පයිතගරස් ප්‍රමේයය:</strong> c² = a² + b² (කර්ණය² = පාදය 1² + පාදය 2²)`;
        }

        if (lower === "වර්ගඵලය" || lower === "area") {
            return `🧮 <strong>ප්‍රධාන වර්ගඵල සූත්‍ර:</strong>
• සෘජුකෝණාස්‍රයක වර්ගඵලය = දිග × පළල
• ත්‍රිකෝණයක වර්ගඵලය = ½ × ආධාරකය × උස
• වෘත්තයක වර්ගඵලය = πr²`;
        }

        if (lower === "පරිමාව" || lower === "volume") {
            return `📦 <strong>පරිමා සූත්‍ර:</strong>
• සිලින්ඩරයක පරිමාව: πr²h
• ඝනකයක පරිමාව: l³`;
        }

        if (lower === "cos" || lower === "sin" || lower === "tan") {
            return `📐 <strong>ත්‍රිකෝණමිතික අනුපාත:</strong>
• sin θ = සම්මුඛ පාදය / කර්ණය
• cos θ = බද්ධ පාදය / කර්ණය
• tan θ = සම්මුඛ පාදය / බද්ධ පාදය`;
        }

        try {
            if (/^[\d\+\-\*\/\.\(\)\s]+$/.test(normalized)) {
                let ans = Function('"use strict";return (' + normalized + ')')();
                if (!isNaN(ans)) {
                    return `🧮 <strong>ගණනය කිරීමේ ප්‍රතිඵලය:</strong> ${ans}`;
                }
            }
        } catch (e) {}

        return null;
    }

    async function askGeminiAI(promptText, imageData) {
        if (!GEMINI_API_KEY || GEMINI_API_KEY === "YOUR_API_KEY") {
            return `⚠️ <strong>API Key එක දාලා නැහැ!</strong><br>Code එකේ <code>GEMINI_API_KEY</code> තියෙන තැනට ඔයාගේ API Key එක paste කරන්න.`;
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${GEMINI_API_KEY}`;
        const systemInstruction = "ඔබ 'නදී AI' (Nadee AI) නම් ශ්‍රී ලංකාවේ O/L සිසුන්ට උදව් කරන ගණිත සහායකයාය. පිළිතුරු පැහැදිලිව, සරල සිංහලෙන් සහ පියවරෙන් පියවර ලබා දෙන්න.";

        const parts = [{ text: promptText }];
        if (imageData) {
            parts.push({
                inlineData: {
                    mimeType: imageData.mimeType,
                    data: imageData.data
                }
            });
        }

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: systemInstruction }] },
                    contents: [{ parts: parts }]
                })
            });

            const data = await response.json();

            if (!response.ok) {
                console.error("Gemini API Error:", data);
                return `❌ <strong>API දෝෂයක්:</strong> ${data.error?.message || "සම්බන්ධ වීමට නොහැකි විය."}`;
            }

            let reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "පිළිතුරක් ලබා ගැනීමට නොහැකි විය.";
            return reply.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        } catch (error) {
            console.error("Network Error:", error);
            return `🌐 <strong>අන්තර්ජාල සම්බන්ධතා දෝෂයක්!</strong>`;
        }
    }

    function appendMessage(content, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerHTML = content;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function checkEnter(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
